[project]
name = "comfyui-orbit-to-3d"
description = "Orbit to 3D: turntable selection, VSR and Pixal3D multiview reconstruction"
version = "0.1.0"
license = {file = "LICENSE"} 
# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

dependencies = ["easydict", "meshlib", "trimesh"]

[project.optional-dependencies]
background-removal = ["rembg"]
remove-small-holes = ["scikit-image"]

[project.urls]
Repository = "https://github.com/mefisure-create/ComfyUI-OrbitTo3D"
Documentation = "https://github.com/mefisure-create/ComfyUI-OrbitTo3D/tree/main/docs"
"Bug Tracker" = "https://github.com/mefisure-create/ComfyUI-OrbitTo3D/issues"

[tool.comfy]
PublisherId = "fadj"
DisplayName = "ComfyUI-OrbitTo3D"
Icon = ""
includes = [] 
